name: CI/CD - Analyse PR (SonarCloud)

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────
  # ANALYSE COMPLÈTE : Backend + Frontend
  # ─────────────────────────────────────────────
  full-analysis:
    name: Analyse complète (Java + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ebooks-frontend/package-lock.json

      - name: Cache Maven + SonarCloud
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          key: ${{ runner.os }}-maven-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-sonar-

      - name: Installation des dépendances npm
        working-directory: ebooks-frontend
        run: npm ci

      - name: Vérification ESLint (React)
        working-directory: ebooks-frontend
        run: npm run build -- --max-warnings 0
        continue-on-error: true

      - name: Build + Tests + Analyse SonarCloud (Java + React)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=src/main/java,ebooks-frontend/src \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.javascript.file.suffixes=.js,.jsx \
            -Dsonar.exclusions="\
              **/entity/**,\
              **/dto/**,\
              **/config/**,\
              **/*Config.java,\
              **/controller/**,\
              **/email/**,\
              **/securingweb/**,\
              **/scheduler/**,\
              **/init/**,\
              **/data/**,\
              **/enums/**,\
              ebooks-frontend/src/**/*.test.js,\
              ebooks-frontend/src/**/*.spec.js,\
              ebooks-frontend/src/setupTests.js,\
              ebooks-frontend/src/reportWebVitals.js" \
            -Dsonar.coverage.exclusions="\
              **/entity/**,\
              **/dto/**,\
              **/config/**,\
              **/*Config.java,\
              **/controller/**,\
              **/email/**,\
              **/securingweb/**,\
              **/scheduler/**,\
              **/init/**,\
              **/data/**,\
              **/enums/**,\
              **/main/**,\
              **/*Application.java"

      - name: Sauvegarder le rapport SonarCloud (report-task.txt)
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report-task
          path: .scannerwork/report-task.txt
          retention-days: 1

  # ─────────────────────────────────────────────
  # QUALITY GATE : Vérification du seuil qualité
  # ─────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ full-analysis ]

    steps:
      - name: Télécharger le rapport SonarCloud
        uses: actions/download-artifact@v4
        with:
          name: sonar-report-task
          path: .scannerwork

      - name: Attente du Quality Gate SonarCloud
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
