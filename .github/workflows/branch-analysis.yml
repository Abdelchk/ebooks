name: CI/CD - Analyse branche (SonarCloud)

on:
  push:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # ANALYSE DE BRANCHE : Met à jour SonarCloud
  # avec l'état de main et develop après chaque merge
  # ─────────────────────────────────────────────
  branch-analysis:
    name: Analyse branche ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ebooks-frontend/package-lock.json

      - name: Cache Maven + SonarCloud
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          key: ${{ runner.os }}-maven-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-sonar-

      - name: Installation des dépendances npm
        working-directory: ebooks-frontend
        run: npm ci

      - name: Build + Tests + Analyse SonarCloud (branche)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.sources=src/main/java,ebooks-frontend/src \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.javascript.file.suffixes=.js,.jsx \
            -Dsonar.exclusions="\
              **/entity/**,\
              **/dto/**,\
              **/config/**,\
              **/*Config.java,\
              **/controller/**,\
              **/email/**,\
              **/securingweb/**,\
              **/scheduler/**,\
              **/init/**,\
              **/data/**,\
              **/enums/**,\
              ebooks-frontend/src/**/*.test.js,\
              ebooks-frontend/src/**/*.spec.js,\
              ebooks-frontend/src/setupTests.js,\
              ebooks-frontend/src/reportWebVitals.js" \
            -Dsonar.coverage.exclusions="\
              **/entity/**,\
              **/dto/**,\
              **/config/**,\
              **/*Config.java,\
              **/controller/**,\
              **/email/**,\
              **/securingweb/**,\
              **/scheduler/**,\
              **/init/**,\
              **/data/**,\
              **/enums/**,\
              **/main/**,\
              **/*Application.java"

