# ─── Base de données Railway MySQL (réseau interne - pas de frais) ───────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Paris
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ─── Serveur (Railway injecte PORT automatiquement) ──────────────────────────
server.port=${PORT:8080}

# ─── CORS : URL du frontend Vercel ───────────────────────────────────────────
frontend.url=${FRONTEND_URL}

# ─── Cloudinary (variables Railway) ──────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ─── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=Europe/Paris

# ─── Groq AI ──────────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# ─── reCAPTCHA ────────────────────────────────────────────────────────────────
recaptcha.project.id=${RECAPTCHA_PROJECT_ID}
recaptcha.site.key=${RECAPTCHA_SITE_KEY}
recaptcha.score.threshold=0.5

# ─── Désactiver devtools en prod ──────────────────────────────────────────────
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=true

# ─── Cookie de session cross-origin (Vercel → Railway) ────────────────────────
# SameSite=None est obligatoire pour que le navigateur accepte d'envoyer le cookie
# JSESSIONID dans les requêtes XHR cross-origin (fetch/axios withCredentials:true).
# Secure=true est exigé par le standard lorsque SameSite=None est utilisé.
# En local (HTTP), le cookie reste SameSite=Lax par défaut (voir application.properties).
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

