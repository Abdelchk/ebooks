# Config Spring Boot pour les tests CI (remplace MySQL par H2 en mémoire)
spring.datasource.url=jdbc:h2:mem:ebookstest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Désactiver la validation Hibernate automatique : on valide manuellement dans le service avant encodage
spring.jpa.properties.jakarta.persistence.validation.mode=none

