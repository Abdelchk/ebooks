# ─────────────────────────────────────────────
# Configuration SonarCloud - Frontend React
# ─────────────────────────────────────────────

# sonar.organization et sonar.projectKey sont injectés via les secrets CI
# (même projet SonarCloud que le backend)
# SONAR_ORGANIZATION et SONAR_PROJECT_KEY dans GitHub → Settings → Secrets
sonar.projectName=Ebooks (React + Spring Boot)
sonar.projectVersion=0.1.0

# Sources
sonar.sources=src
sonar.exclusions=\
  node_modules/**,\
  build/**,\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/setupTests.js,\
  src/reportWebVitals.js,\
  public/**

# Tests
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.spec.js

# Couverture (si tu lances jest avec --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8

